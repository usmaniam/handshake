[project]
name = "handshake-api"
version = "0.1.0"
description = "Handshake: agents shake on a deal; PayPal pays when it's delivered."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
  "httpx>=0.27", "pydantic>=2.7", "defusedxml>=0.7", "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
